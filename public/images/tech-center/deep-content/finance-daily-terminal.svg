<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Financial daily report review terminal</title>
  <desc id="desc">A daily report dashboard shows a draft, data quality checks, alerts, and an approval action.</desc>
  <rect width="1200" height="630" fill="#f1f5f9" rx="28"/>
  <text x="72" y="92" fill="#0f172a" font-family="Arial, sans-serif" font-size="38" font-weight="700">Daily report review terminal</text>
  <text x="72" y="132" fill="#475569" font-family="Arial, sans-serif" font-size="22">Draft quality, alerts, and approval stay visible together</text>
  <rect x="72" y="184" width="1056" height="350" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <g font-family="Arial, sans-serif">
    <rect x="112" y="226" width="300" height="240" rx="14" fill="#eff6ff"/><text x="144" y="274" fill="#1e3a8a" font-size="24" font-weight="700">Report draft</text><text x="144" y="322" fill="#334155" font-size="20">Market summary</text><text x="144" y="358" fill="#334155" font-size="20">Yield movement</text><text x="144" y="394" fill="#334155" font-size="20">Risk notes</text><text x="144" y="442" fill="#64748b" font-size="18">Version 2026-08-24</text>
    <rect x="448" y="226" width="300" height="240" rx="14" fill="#f0fdf4"/><text x="480" y="274" fill="#166534" font-size="24" font-weight="700">Quality checks</text><text x="480" y="322" fill="#334155" font-size="20">✓ Source freshness</text><text x="480" y="358" fill="#334155" font-size="20">✓ Field mapping</text><text x="480" y="394" fill="#334155" font-size="20">✓ Calculation rules</text><text x="480" y="442" fill="#64748b" font-size="18">Audit trail attached</text>
    <rect x="784" y="226" width="304" height="240" rx="14" fill="#fefce8"/><text x="816" y="274" fill="#854d0e" font-size="24" font-weight="700">Decision</text><text x="816" y="322" fill="#334155" font-size="20">Reviewer: business owner</text><rect x="816" y="350" width="198" height="50" rx="10" fill="#16a34a"/><text x="915" y="382" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">Approve draft</text><text x="816" y="442" fill="#64748b" font-size="18">Alert status: clear</text>
  </g>
</svg>
