<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Financial research search and review terminal</title>
  <desc id="desc">A research terminal presents matched reports, structured findings, and a review queue.</desc>
  <rect width="1200" height="630" fill="#f8fafc" rx="28"/>
  <rect x="56" y="56" width="1088" height="518" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="56" y="56" width="1088" height="76" rx="20" fill="#0f172a"/>
  <circle cx="96" cy="94" r="10" fill="#fb7185"/><circle cx="130" cy="94" r="10" fill="#facc15"/><circle cx="164" cy="94" r="10" fill="#4ade80"/>
  <text x="210" y="102" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="24" font-weight="700">Research review terminal</text>
  <rect x="100" y="176" width="1000" height="58" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="128" y="212" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="22">Query: sector outlook, risk signals, and report date</text>
  <g font-family="Arial, sans-serif">
    <rect x="100" y="274" width="440" height="230" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <text x="132" y="320" fill="#166534" font-size="24" font-weight="700">Matched reports</text>
    <text x="132" y="366" fill="#334155" font-size="20">• Source and date retained</text>
    <text x="132" y="402" fill="#334155" font-size="20">• Relevant passages grouped</text>
    <text x="132" y="438" fill="#334155" font-size="20">• Permissions checked</text>
    <rect x="580" y="274" width="520" height="230" rx="14" fill="#faf5ff" stroke="#c4b5fd" stroke-width="2"/>
    <text x="612" y="320" fill="#581c87" font-size="24" font-weight="700">Review queue</text>
    <text x="612" y="366" fill="#334155" font-size="20">Structured finding draft</text>
    <rect x="612" y="390" width="180" height="42" rx="10" fill="#7c3aed"/><text x="702" y="418" fill="#fff" text-anchor="middle" font-size="18">Human review</text>
    <text x="612" y="472" fill="#334155" font-size="18">Audit trail: query · source · reviewer</text>
  </g>
</svg>
